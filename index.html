 </div>

 <div class="fmts">${STATIC.formats.map(x => `<div class="fmt"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join("")}</div>
 <p class="principle">Brend hekayəyə yalnız mövzuya təbii uyğun gəldikdə daxil edilir. Faktları dəyişən və ya auditoriyanı yanıldan inteqrasiyalar qəbul edilmir. Bu, izləyicinin FikirList-ə olan etibarını qoruyur və tərəfdaşın mesajını daha inandırıcı edir.</p>

  document.getElementById("pdf").addEventListener("click", () => { try { window.print(); } catch (e) {} });

function startReel() {
  const reel = document.querySelector(".reel"); if (!reel || !VIDEOS.length) return;
  const slides = [...reel.querySelectorAll(".slide")], segs = [...reel.querySelectorAll(".segs i")], cap = reel.querySelector(".cap");
  clearInterval(window.__reelT); const ok = new Array(slides.length).fill(false); let started = false, i = -1, timer = null;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, DUR = 5200;
  const show = n => {
    slides.forEach((s, k) => s.classList.toggle("on", k === n));
    segs.forEach((g, k) => { g.classList.toggle("done", k < n); g.classList.remove("on"); });
    void segs[n].offsetWidth; segs[n].style.setProperty("--dur", DUR + "ms"); segs[n].classList.add("on");
    cap.textContent = "";
    String(VIDEOS[n][1]).split(/\s+/).forEach((w, k) => { const sp = document.createElement("span"); sp.textContent = w; sp.style.animationDelay = (0.35 + k * 0.12) + "s"; cap.appendChild(sp); cap.appendChild(document.createTextNode(" ")); });
  };
  const next = () => { let n = i; for (let t = 0; t < slides.length; t++) { n = (n + 1) % slides.length; if (ok[n]) break; } if (!ok[n]) return; i = n; show(i); };
  const begin = () => { if (started) return; started = true; reel.classList.add("has-slides"); next(); if (!reduce) window.__reelT = timer = setInterval(next, DUR); };
  VIDEOS.forEach((v, k) => {
    const im = new Image();
    im.onload = () => { if (im.naturalWidth > 200) { ok[k] = true; slides[k].style.backgroundImage = `url('${im.src}')`; begin(); } else tryHq(); };
    const tryHq = () => { const h = new Image(); h.onload = () => { if (h.naturalWidth > 200) { ok[k] = true; slides[k].style.backgroundImage = `url('${h.src}')`; begin(); } }; h.src = "https://i.ytimg.com/vi/" + encodeURIComponent(v[0]) + "/hqdefault.jpg"; };
    im.onerror = tryHq;
    im.src = "https://i.ytimg.com/vi/" + encodeURIComponent(v[0]) + "/oar2.jpg";
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { clearInterval(timer); timer = null; } else if (started && !reduce && !timer) window.__reelT = timer = setInterval(next, DUR); });
}

function countUp() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".fig b[data-n]").forEach(el => {
    const end = num(el.dataset.n); if (end === null) return;
    const isP = el.dataset.k === "p", t0 = performance.now(), dur = 1100;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - (1 - k) ** 3;
      el.textContent = isP ? pct(end * e) : fmt(Math.round(end * e)); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function fail(msg) {
  document.getElementById("app").innerHTML = `<div class="loading"><div style="text-align:center;padding:24px"><h2>Məlumatları yükləmək olmadı</h2><p style="color:var(--soft)">${esc(msg)}</p></div></div>`;
}

if (!SHEET_ID) { render(DEMO, true); }
else {
  const timer = setTimeout(() => render(SNAPSHOT, false), 8000);
  window.fikirSheet = resp => {
    clearTimeout(timer);
    try {
      if (!resp || resp.status === "error") throw new Error("Cədvəl oxunmadı");
      const D = {};
      resp.table.rows.forEach(r => { const k = r.c && r.c[0] && r.c[0].v; if (!k) return; const c = r.c[1]; D[String(k).trim()] = c ? (c.v ?? c.f ?? "") : ""; });
      if (typeof D.updatedAt === "string" && D.updatedAt.indexOf("Date(") === 0) { const a = D.updatedAt.match(/\d+/g).map(Number); D.updatedAt = new Date(a[0], a[1], a[2]); }
      render(D, false);
    } catch (e) { render(SNAPSHOT, false); }
  };
  const s = document.createElement("script");
  s.src = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(SHEET_ID) + "/gviz/tq?headers=1&sheet=" + encodeURIComponent(SHEET_NAME) + "&tqx=" + encodeURIComponent("responseHandler:fikirSheet") + "&_=" + Date.now();
  s.onerror = () => { clearTimeout(timer); render(SNAPSHOT, false); };
  document.body.appendChild(s);
}
}
